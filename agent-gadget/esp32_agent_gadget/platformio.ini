[platformio]
src_dir = .
default_envs = esp32dev

; USB upload (automatic reset through DTR/RTS: no need to press BOOT)
[env:esp32dev]
platform = espressif32
board = esp32dev
framework = arduino
monitor_speed = 115200
upload_port = COM3

; Wi-Fi (OTA) upload:  pio run -e esp32dev_ota -t upload
; Same password as OTA_PASSWORD in net.h. Use --upload-port <ip> if mDNS is not resolved.
[env:esp32dev_ota]
extends = env:esp32dev
upload_protocol = espota
upload_port = agent-gadget.local
upload_flags =
    --auth=agent-gadget

; Test builds: enable the /debug endpoints (never ship these).
; esp32dev_test: API tests, NO screen drawing (serial backend): fast, and the blocking 9600-baud redraws
;   cannot starve the HTTP loop. esp32dev_test_screen: same endpoints with the real screen layer.
[env:esp32dev_test]
extends = env:esp32dev
build_flags = -DGADGET_DEBUG -DDISPLAY_SERIAL

[env:esp32dev_test_screen]
extends = env:esp32dev
build_flags = -DGADGET_DEBUG

[env:esp32dev_test_ota]
extends = env:esp32dev_ota
build_flags = -DGADGET_DEBUG -DDISPLAY_SERIAL

; Same firmware without a screen: the display goes to the serial monitor (see display_serial.cpp)
[env:esp32dev_noscreen]
extends = env:esp32dev
build_flags = -DDISPLAY_SERIAL
